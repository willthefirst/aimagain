{% extends "base.html" %} {% block title %}Login{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
<article>
  <header>
    <h1>Login</h1>
  </header>
  <!-- FastAPI Users JWT login endpoint expects 'username' (which is email) and 'password' as form data. -->
  <form
    method="post"
    action="/auth/jwt/login{% if next_url %}?next={{ next_url }}{% endif %}">
    <label for="username">
      Email
      <input type="email" id="username" name="username" />
    </label>
    <label for="password">
      Password
      <input type="password" id="password" name="password" />
    </label>
    <button type="submit">Login</button>
  </form>
  <footer>
    <p>
      Forgot your password?
      <a href="/auth/forgot-password">Reset here</a>
    </p>
    <p>
      Need an account?
      <a href="/auth/register">Register here</a>
    </p>
  </footer>
</article>
{% endblock %}
