<!DOCTYPE html>
{# Self-contained email body — no `{% extends %}`. See README in this dir. #}
<html>
  <body style="font-family: -apple-system, system-ui, sans-serif;
               max-width: 560px;
               margin: 2rem auto;
               line-height: 1.5">
    <p>
      {{ sender_username }} is reaching out regarding your post about
      <a href="{{ post_url }}">{{ post_headline }}</a>.
    </p>
    <blockquote style="border-left: 3px solid #ccc;
                       margin: 1rem 0;
                       padding: 0.25rem 0 0.25rem 1rem;
                       color: #333;
                       white-space: pre-wrap">
      {{ body }}
    </blockquote>
    <p>Reply directly to this email to respond to {{ sender_username }}.</p>
  </body>
</html>
