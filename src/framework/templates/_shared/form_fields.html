{# Form-field render macros.

Each macro emits one labelled field — Pico CSS styles `<label>` and its
nested control as a block, so no `<br>` between fields is needed. Per-
kind form partials read as a flat field list rather than HTML
boilerplate.

## Helper text (`help=...`)

Every input macro accepts `help=None`. When set, it renders a `<small>`
**inside the wrapping `<label>`** as a sibling of the input (Pico's
canonical pattern — https://picocss.com/docs/forms/input). The input
also receives `aria-describedby="<name>-helper"` so screen readers
associate the helper text with the input.

  {{ text_field("npi", "NPI", help="10-digit National Provider Identifier. Optional.") }}

Produces:

  <label for="npi">
    NPI
    <input type="text" id="npi" name="npi" aria-describedby="npi-helper" />
    <small id="npi-helper">10-digit National Provider Identifier. Optional.</small>
  </label>

If a field needs HTML inside the help text (e.g. an inline link), pass
the rendered HTML and it's emitted with `|safe`. Caller is responsible
for escaping any untrusted strings spliced in.

**Never write a bare `<small>` next to a macro call.** It will render as a
sibling of the `<label>` (not next to the input), break the
`aria-describedby` link, and visually drift from the field on narrow
viewports. This is enforced by `test_form_fields.py::
test_no_orphan_small_siblings_in_form_templates`.

## Invalid state (`invalid=None`)

`invalid` is a tri-state — `None` (default, no aria), `True` (sets
`aria-invalid="true"`, Pico colors the field + small red), `False`
(`aria-invalid="false"`, Pico colors green). Callsites typically set
this implicitly via the `error=` parameter below.

## Inline error text (`error=None`)

`error` is a string. When set, the macro follows Pico's canonical
invalid-form pattern (https://picocss.com/docs/forms/input):

  - the `<small id="<name>-helper">` slot carries the error text
    instead of the helper text (one small per field, single id),
  - the input keeps `aria-describedby="<name>-helper"` so screen
    readers announce the error,
  - the input auto-sets `aria-invalid="true"` — Pico colors both the
    input and the sibling `<small>` red via its
    `[aria-invalid="true"] ~ small` rule (callers don't pass
    `invalid=` redundantly alongside `error=`).

If both `help=` and `error=` are set, the error wins — the helper text
is suppressed for that render so the visible message is the actionable
one.

## Auto-resolution from `form_errors` / `form_values` (declarative)

For forms wired into the `form_error_render` opt-in on `EntitySpec`,
each input macro **auto-resolves** `error` from `form_errors.get(name)`
and prefills `current` from `form_values.get(name, current)` — the
template author calls `field_for(schema, "x", "X")` and the framework
handles both error rendering and submitted-value prefill on re-render.

Two requirements for auto-resolution to kick in:

  1. **The template must import macros `with context`** so the macros
     can see the render-context vars:

         {%- from "_shared/form_fields.html"
             import text_field, field_for, ... with context -%}

     Without `with context`, the macros silently fall back to "no
     auto-resolution" (caller's explicit `error=`/`current=` still
     work). The smoke test on the route is the safety net.
  2. **The framework injects `form_errors` and `form_values` into the
     render context** — `mount_create`'s `_render_form_with_errors`
     (see `src/framework/dispatch/mounts/create.py`) does this on a
     validation-failure re-render. On a successful GET both are empty
     and the macros behave exactly as if the caller hadn't asked for
     auto-resolution.

Explicit caller args **always win** — passing `error="..."` or
`current=<x>` overrides the context lookup. This keeps existing
non-opted-in templates working unchanged and lets opted-in templates
override the auto-resolution for the rare case where the caller
genuinely knows better (e.g. a synthesized error message that doesn't
match a Pydantic field).

## Schema dispatch (`field_for`)

`field_for(schema, name, label, current=None, required=None, help=None)`
calls `field_spec(schema, name)` (a Jinja global pointing at
`src/framework/rendering/form_fields.field_spec`) and dispatches to the
right control. `help` and `required` pass through; pass `required=false`
to override the schema-derived default.

## `<select>` from a list of entities

Picking an organization, a parent organization, a program — anywhere
a form posts a foreign key to another resource — use
`entity_select_field`. It takes a list of objects with `.id` + `.name`
(or pass `option_template_attr` to name a different display attribute).
Composite-label cases (e.g. "<Program> · <Org>") pre-build a list of
`(id, label)` tuples and pass that via `options=...` instead.

#}
{# ---- helpers (internal) ------------------------------------------- #}
{# Renders the input-attribute fragment shared by every text-like macro.
   Builds `aria-describedby` only when `help` is set, and emits
   `aria-invalid` only when `invalid is not none`. Macros call this
   inline rather than via macro-call to avoid double-whitespace in the
emitted attribute string. #}
{# Pico's canonical "one small per field" slot: when `error` is set the
   small carries the error text; otherwise (and when `help` is set) it
   carries the helper text. The id stays `<name>-helper` either way so
   the input's `aria-describedby="<name>-helper"` stays valid in both
   states without re-wiring. Pico's `[aria-invalid="true"] ~ small`
   selector colors the small red automatically when the input has
   `aria-invalid="true"`. #}
{% macro _help_small(name, help, error=None) -%}
  {%- if error %}<small id="{{ name }}-helper">{{ error }}</small>
  {%- elif help %}<small id="{{ name }}-helper">{{ help|safe }}</small>{%- endif %}
{%- endmacro %}
{# Field label + optional indicator. Every macro funnels its label through
   here so the "(optional)" marker is the *only* way an optional field is
   communicated visually — there is no `help="Optional."` pattern anymore
   (the per-field marker beats a help line both visually and in terms of
   discoverability). The gap between the label and "(optional)" is owned
   by `.form-field-optional { margin-inline-start }` in `base.html` — do
   not introduce literal whitespace here (spacing belongs in CSS, not
   markup). Pinned by ``src/domain/templates/test_copy_conventions.py``
   (copy) and ``test_form_fields.py`` (no literal-space markup).
#}
{% macro _field_label(label, required) -%}
  {{ label }}{%- if not required -%}<small class="form-field-optional">(optional)</small>{%- endif -%}
{%- endmacro %}
{# ---- text-like inputs --------------------------------------------- #}
{% macro text_field(name, label, current=None, required=True, pattern=None, maxlength=None, help=None, invalid=None, error=None, type="text", autocomplete=None) -%}
  {%- set _form_errors = form_errors|default({}, true) -%}
  {%- set _form_values = form_values|default({}, true) -%}
  {%- set error = error if error is not none else _form_errors.get(name) -%}
  {%- set current = _form_values[name] if name in _form_values else current -%}
  {%- set aria_invalid = true if error else invalid -%}
  <label class="form-field" for="{{ name }}">
    <span class="form-field-label">{{ _field_label(label, required) }}</span>
    <input type="{{ type }}"
           id="{{ name }}"
           name="{{ name }}"
           {% if current is not none %}value="{{ current }}"{% endif %}
           {% if pattern %}pattern="{{ pattern }}"{% endif %}
           {% if maxlength %}maxlength="{{ maxlength }}"{% endif %}
           {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
           {% if required %}required{% endif %}
           {% if help or error %}aria-describedby="{{ name }}-helper"{% endif %}
           {% if aria_invalid is not none %}aria-invalid="{{ 'true' if aria_invalid else 'false' }}"{% endif %} />
    {{- _help_small(name, help, error) }}
  </label>
{%- endmacro %}
{% macro textarea_field(name, label, current=None, required=True, help=None, invalid=None, error=None) -%}
  {%- set _form_errors = form_errors|default({}, true) -%}
  {%- set _form_values = form_values|default({}, true) -%}
  {%- set error = error if error is not none else _form_errors.get(name) -%}
  {%- set current = _form_values[name] if name in _form_values else current -%}
  {%- set aria_invalid = true if error else invalid -%}
  <label class="form-field" for="{{ name }}">
    <span class="form-field-label">{{ _field_label(label, required) }}</span>
    <textarea id="{{ name }}"
              name="{{ name }}"
              {% if required %}required{% endif %}
              {% if help or error %}aria-describedby="{{ name }}-helper"{% endif %}
              {% if aria_invalid is not none %}aria-invalid="{{ 'true' if aria_invalid else 'false' }}"{% endif %}>{{ current or "" }}</textarea>
    {{- _help_small(name, help, error) }}
  </label>
{%- endmacro %}
{# `url_field` is `text_field(type="url")` with a more readable callsite.
   Browsers validate the URL on submit; the Pydantic schema's
   `HttpUrl`/`HtmlUrl` re-validates server-side. #}
{% macro url_field(name, label, current=None, required=True, help=None, invalid=None, error=None) -%}
  {{ text_field(name, label, current=current, required=required, help=help, invalid=invalid, error=error, type="url") }}
{%- endmacro %}
{# ---- selects ------------------------------------------------------- #}
{% macro select_field(name, label, options, labels=None, current=None, required=True, placeholder=False, help=None, invalid=None, error=None) -%}
  {%- set _form_errors = form_errors|default({}, true) -%}
  {%- set _form_values = form_values|default({}, true) -%}
  {%- set error = error if error is not none else _form_errors.get(name) -%}
  {%- set current = _form_values[name] if name in _form_values else current -%}
  {%- set aria_invalid = true if error else invalid -%}
  <label class="form-field" for="{{ name }}">
    <span class="form-field-label">{{ _field_label(label, required) }}</span>
    <select id="{{ name }}"
            name="{{ name }}"
            {% if required %}required{% endif %}
            {% if help or error %}aria-describedby="{{ name }}-helper"{% endif %}
            {% if aria_invalid is not none %}aria-invalid="{{ 'true' if aria_invalid else 'false' }}"{% endif %}>
      {%- if placeholder and not current %}<option value="" disabled selected>--</option>{%- endif %}
      {%- for v in options %}
        <option value="{{ v }}"{% if current == v %} selected{% endif %}>{{ labels[v] if labels else v }}</option>
      {%- endfor %}
    </select>
    {{- _help_small(name, help, error) }}
  </label>
{%- endmacro %}
{# `<select multiple>` driven by a controlled-vocabulary tuple. One
   option per value; selected ones get `selected`. Multi selections
   serialize as repeated `name=v` pairs under
   application/x-www-form-urlencoded; under htmx's `json-enc` the
   extension emits an array for 2+ selections, scalar for 1, absent for
   0 — the schema's `_scalar_to_list` `BeforeValidator` re-wraps the
   scalar back into a list. Used today for create/edit forms; the
   search-form variant is `.search-checkbox-fieldset` (one checkbox per
   value), not this macro. #}
{# Multi-select: `required=False` by default because the canonical
   semantic is "any subset, including the empty set" (no in-network
   carriers, no featured services). Callers can pass `required=True`
   to force at least one selection. #}
{% macro multi_select_field(name, label, options, labels=None, current=None, required=False, help=None, invalid=None, error=None) -%}
  {%- set _form_errors = form_errors|default({}, true) -%}
  {%- set _form_values = form_values|default({}, true) -%}
  {%- set error = error if error is not none else _form_errors.get(name) -%}
  {%- set current = _form_values[name] if name in _form_values else current -%}
  {%- set selected = current or [] -%}
  {%- set aria_invalid = true if error else invalid -%}
  <label class="form-field" for="{{ name }}">
    <span class="form-field-label">{{ _field_label(label, required) }}</span>
    <select id="{{ name }}"
            name="{{ name }}"
            multiple
            size="{{ [options|length, 8]|min }}"
            {% if help or error %}aria-describedby="{{ name }}-helper"{% endif %}
            {% if aria_invalid is not none %}aria-invalid="{{ 'true' if aria_invalid else 'false' }}"{% endif %}>
      {%- for v in options %}
        <option value="{{ v }}"{% if v in selected %} selected{% endif %}>{{ labels[v] if labels else v }}</option>
      {%- endfor %}
    </select>
    {{- _help_small(name, help, error) }}
  </label>
{%- endmacro %}
{# `<select>` populated from a list of entity rows — the canonical
   foreign-key picker (`org_id` on Clinician/Program forms, `parent_org_id`
   on Org forms, etc). Replaces hand-rolled per-template `<select>`s.

   `entities` is a sequence of objects with `.id` and `.name` (or
   another attribute pair — pass `value_attr`/`label_attr` to override).
   For composite labels (e.g. "<Program> · <Org>"), build the list in
   the route handler as `[(id, "Program · Org"), ...]` tuples and pass
   `options=that_list` to `select_field` directly instead.

   `blank_label=None` (default) renders Pico's disabled "--" placeholder
   when the field is required and unset; pass `blank_label="(root — no
   parent)"` to surface a real empty-value option (root organization,
   the "(no clinician)" branch, etc).

   `current` is the prefilled UUID/value (None on create, the persisted
   value on edit). String/UUID equality is handled by stringifying both
   sides — the option `value` attribute is stringified by the browser
   anyway, so callers don't need to coerce. #}
{% macro entity_select_field(name, label, entities, current=None, required=True, blank_label=None, help=None, invalid=None, error=None, value_attr="id", label_attr="name") -%}
  {%- set _form_errors = form_errors|default({}, true) -%}
  {%- set _form_values = form_values|default({}, true) -%}
  {%- set error = error if error is not none else _form_errors.get(name) -%}
  {%- set current = _form_values[name] if name in _form_values else current -%}
  {%- set current_s = current|string if current is not none else "" -%}
  {%- set aria_invalid = true if error else invalid -%}
  <label class="form-field" for="{{ name }}">
    <span class="form-field-label">{{ _field_label(label, required) }}</span>
    <select id="{{ name }}"
            name="{{ name }}"
            {% if required %}required{% endif %}
            {% if help or error %}aria-describedby="{{ name }}-helper"{% endif %}
            {% if aria_invalid is not none %}aria-invalid="{{ 'true' if aria_invalid else 'false' }}"{% endif %}>
      {%- if blank_label is not none %}
        <option value=""{% if current_s == "" %} selected{% endif %}>{{ blank_label }}</option>
      {%- elif required and not current %}
        <option value="" disabled selected>--</option>
      {%- endif %}
      {%- for e in entities %}
        {%- set ev = e[value_attr] if e is mapping else e|attr(value_attr) -%}
        {%- set el = e[label_attr] if e is mapping else e|attr(label_attr) -%}
        <option value="{{ ev }}"{% if current_s == ev|string %} selected{% endif %}>{{ el }}</option>
      {%- endfor %}
    </select>
    {{- _help_small(name, help, error) }}
  </label>
{%- endmacro %}
{# ---- radio groups ------------------------------------------------- #}
{# Yes / No radio pair. `<fieldset>` + `<legend>` is the accessible
   substitute for `<label>` when one logical question owns multiple
   inputs. Each radio carries `aria-describedby` so screen readers
   announce the helper text on either selection. #}
{% macro radio_bool_field(name, label, current=None, required=True, help=None) -%}
  <fieldset class="form-field">
    <legend class="form-field-label">{{ _field_label(label, required) }}</legend>
    <div class="form-field-control">
      <label class="form-field-inline">
        <input type="radio"
               name="{{ name }}"
               value="true"
               {% if current is sameas true %}checked{% endif %}
               {% if required %}required{% endif %}
               {% if help %}aria-describedby="{{ name }}-helper"{% endif %} />
        Yes
      </label>
      <label class="form-field-inline">
        <input type="radio"
               name="{{ name }}"
               value="false"
               {% if current is sameas false %}checked{% endif %}
               {% if required %}required{% endif %}
               {% if help %}aria-describedby="{{ name }}-helper"{% endif %} />
        No
      </label>
      {{- _help_small(name, help) }}
    </div>
  </fieldset>
{%- endmacro %}
{# ---- schema-driven dispatch --------------------------------------- #}
{# Reads `field_spec(schema, name)` and delegates to the right inner
   macro. `current`, `required`, `help`, `invalid` pass through. Pass
   `required=false` to override the schema-derived default (e.g. an
   optional filter on a field that's required for create). #}
{% macro field_for(schema, name, label, current=None, required=None, help=None, invalid=None, error=None) -%}
  {%- set _form_errors = form_errors|default({}, true) -%}
  {%- set _form_values = form_values|default({}, true) -%}
  {%- set error = error if error is not none else _form_errors.get(name) -%}
  {%- set current = _form_values[name] if name in _form_values else current -%}
  {%- set spec = field_spec(schema, name) -%}
  {%- set is_required = spec.required if required is none else required -%}
  {%- if spec.kind == "select" -%}
    {{ select_field(name, label, spec.choices, labels=spec.labels, current=current, required=is_required, placeholder=true, help=help, invalid=invalid, error=error) }}
  {%- elif spec.kind == "multi_select" -%}
    {{ multi_select_field(name, label, spec.choices, labels=spec.labels, current=current, help=help, invalid=invalid, error=error) }}
  {%- elif spec.kind == "textarea" -%}
    {{ textarea_field(name, label, current=current, required=is_required, help=help, invalid=invalid, error=error) }}
  {%- elif spec.kind == "url" -%}
    {{ url_field(name, label, current=current, required=is_required, help=help, invalid=invalid, error=error) }}
  {%- elif spec.kind == "text" -%}
    {{ text_field(name, label, current=current, required=is_required, pattern=spec.pattern, maxlength=spec.maxlength, help=help, invalid=invalid, error=error) }}
  {%- endif -%}
{%- endmacro %}
{# ---- form section ------------------------------------------------- #}
{# Canonical `<fieldset>` + `<legend>` wrapper for a named group of
   fields. Replaces hand-written fieldsets in every form template so
   the section chrome is defined once and layout changes apply
   everywhere.

   Usage:
     {% call form_section("Client location") %}
       {{ text_field("location_city", "City") }}
       {{ select_field("location_state", "State", US_STATES) }}
     {% endcall %}
#}
{% macro form_section(title) -%}
  <fieldset class="form-section">
    <legend>{{ title }}</legend>
    {{ caller() }}
  </fieldset>
{%- endmacro %}
{# ---- specialized widgets ------------------------------------------ #}
{# Day × time-of-day checkbox grid. One checkbox per (day, part) pair;
   all share the same `name` so the json-enc-arrays extension serializes
   them as a single JSON array of `<day>_<part>` tokens. `current` is an
   iterable of currently-selected tokens (`[]` on create, the persisted
   list on edit). The form using this macro must also declare
   `data-array-fields="<name> ..."` so a 0-checked grid still posts an
   empty array. #}
{# `time_grid_field` is `required=False` by default — every existing
   usage treats "no checkboxes selected" as a legitimate state. Callers
   that need a non-empty selection can pass `required=True` (no caller
   today). #}
{% macro time_grid_field(name, label, current=None, required=False, help=None) -%}
  {%- set selected = current or [] -%}
  <fieldset class="form-field">
    <legend class="form-field-label">{{ _field_label(label, required) }}</legend>
    <table>
      <thead>
        <tr>
          <th></th>
          {%- for part in DESIRED_TIME_PARTS %}<th scope="col">{{ DESIRED_TIME_PART_LABELS[part] }}</th>{%- endfor %}
        </tr>
      </thead>
      <tbody>
        {%- for day in DESIRED_TIME_DAYS %}
          <tr>
            <th scope="row">{{ DESIRED_TIME_DAY_SHORT_LABELS[day] }}</th>
            {%- for part in DESIRED_TIME_PARTS %}
              {%- set token = day ~ "_" ~ part -%}
              <td>
                <input type="checkbox"
                       name="{{ name }}"
                       value="{{ token }}"
                       {% if token in selected %}checked{% endif %}
                       aria-label="{{ DESIRED_TIME_DAY_LABELS[day] }} {{ DESIRED_TIME_PART_LABELS[part] }}" />
              </td>
            {%- endfor %}
          </tr>
        {%- endfor %}
      </tbody>
    </table>
    {{- _help_small(name, help) }}
  </fieldset>
{%- endmacro %}
