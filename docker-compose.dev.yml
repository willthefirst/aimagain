services:
  bedlam-connect-dev:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8000}:8000'
      - '${LIVERELOAD_PORT:-35729}:35729'
    environment:
      - SECRET=${SECRET}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/bedlam-connect.db}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - DISABLE_SCHEDULER=1
      - APP_PORT=${APP_PORT:-8000}
      - LIVERELOAD_PORT=${LIVERELOAD_PORT:-35729}
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./scripts:/app/scripts # Mount scripts for development startup
      - ./alembic:/app/alembic # Mount migrations so new revisions don't need an image rebuild
    command: ['/app/scripts/runtime/start-dev.sh'] # Override with dev startup script
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
