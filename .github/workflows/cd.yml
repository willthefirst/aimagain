name: CD - Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment files to droplet (manual SCP)
        run: |
          # Create temporary SSH key file from secret
          echo "${{ secrets.DROPLET_SSH_KEY }}" > /tmp/droplet_ssh_key
          chmod 600 /tmp/droplet_ssh_key

          # Set environment variables for the script
          export DROPLET_HOST="${{ secrets.DROPLET_HOST }}"
          export DROPLET_USERNAME="${{ secrets.DROPLET_USERNAME }}"
          export DROPLET_SSH_KEY_PATH="/tmp/droplet_ssh_key"

          # Run the manual copy script
          ./deployment/scripts/deploy-copy-files.sh

          # Clean up temporary key file
          rm -f /tmp/droplet_ssh_key

      - name: Write production .env to droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_BROWSER_DSN: ${{ secrets.SENTRY_BROWSER_DSN }}
          APP_RELEASE: ${{ github.sha }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: APP_SECRET,RESEND_API_KEY,APP_BASE_URL,SENTRY_DSN,SENTRY_BROWSER_DSN,APP_RELEASE
          script: |
            set -e
            # Validate required secrets are present
            for var in APP_SECRET RESEND_API_KEY APP_BASE_URL SENTRY_DSN SENTRY_BROWSER_DSN; do
              if [ -z "${!var}" ]; then
                echo "❌ GitHub Secret '$var' is not set — aborting" >&2
                exit 1
              fi
            done

            mkdir -p /opt/bedlam-connect/config
            {
              printf 'SECRET=%s\n'                         "$APP_SECRET"
              printf 'DATABASE_URL=%s\n'                   'sqlite+aiosqlite:///data/bedlam-connect.db'
              printf 'ACCESS_TOKEN_EXPIRE_MINUTES=%s\n'    '60'
              printf 'EMAIL_BACKEND=%s\n'                  'resend'
              printf 'EMAIL_FROM=%s\n'                     'no-reply@bedlamconnect.com'
              printf 'RESEND_API_KEY=%s\n'                 "$RESEND_API_KEY"
              printf 'APP_BASE_URL=%s\n'                   "$APP_BASE_URL"
              printf 'SENTRY_DSN=%s\n'                     "$SENTRY_DSN"
              printf 'SENTRY_BROWSER_DSN=%s\n'             "$SENTRY_BROWSER_DSN"
              printf 'APP_RELEASE=%s\n'                    "$APP_RELEASE"
            } > /opt/bedlam-connect/config/.env
            chmod 600 /opt/bedlam-connect/config/.env
            echo "✅ Production .env written to droplet"

      - name: Run deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: APP_BASE_URL
          script: |
            cd /opt/bedlam-connect/deployment
            chmod +x deploy.sh cleanup-docker.sh
            ./deploy.sh
