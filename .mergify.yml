commands_restrictions:
  queue:
    conditions:
      - or:
        - sender-permission >= write
        - sender = github-actions[bot]

queue_rules:
  - name: default
    queue_conditions:
      - check-success = tests
      - check-success = contract-tests
      - check-success = linting
      - check-success = docker-health-check
    merge_conditions:
      - check-success = tests
      - check-success = contract-tests
      - check-success = linting
      - check-success = docker-health-check
    merge_method: squash
    batch_size: 3
    batch_max_wait_time: 2 minutes
