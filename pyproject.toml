[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bedlam-connect"
version = "0.1.0"
description = "A FastAPI web application with authentication and layered architecture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "pathspec",
]

[project.optional-dependencies]
app = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "python-dotenv",
    "async-lru",
    "Jinja2",
    "selectolax",
    "fastapi-users[sqlalchemy]",
    "aiosqlite",
    "pydantic-settings",
    "asyncstdlib",
    "apscheduler>=3.10,<4",
    # Outbound HTTP for the verification pipeline's NPPES lookups
    # (`src/domain/logic/verifications/nppes.py`). Runtime dep — must
    # ship in the production image, not just `[test]`.
    "httpx",
    # Transactional email provider. Only imported when
    # `EMAIL_BACKEND=resend`; the console/file backends don't load it.
    # See `src/framework/email/README.md`.
    "resend",
    # Error tracking. Disabled when `SENTRY_DSN` is unset (empty string).
    # See `src/main.py` for init and `src/framework/config.py` for the setting.
    "sentry-sdk[fastapi]",
]

dev = [
    "livereload",
    "pathspec",
]

test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pytest-playwright-asyncio",
    "pact-python<3",
    "yarl",
    "requests",
]

# Code quality and formatting
lint = [
    "black==26.3.1",
    "isort==6.0.1",
    "autoflake",
    "djlint==1.36.4",
    "pre-commit",
    "pathspec",
]

# Full application with all runtime dependencies
full = [
    "bedlam-connect[app,dev,test,lint]",
]

# All development dependencies (for contributors)
all = [
    "bedlam-connect[dev,test,lint]",
]

[project.scripts]
dev = "scripts.dev_cli:main"

# Tool configurations
#
# Each formatter excludes `.claude/` regardless of how it's invoked
# (`black .`, `isort .`, pre-commit, `dev lint`). The directory hosts
# per-task git worktrees (see `scripts/dev/preflight_worktree_check.py`)
# whose Python trees would otherwise multiply every project-root walk
# by the number of in-flight worktrees — `isort --check-only .` hung
# in `dev lint` until this exclusion landed.
[tool.black]
line-length = 88
target-version = ['py311']
extend-exclude = '''
/(
    \.claude
)/
'''

[tool.isort]
profile = "black"
line_length = 88
extend_skip = [".claude"]

[tool.djlint]
profile = "jinja"
indent = 2

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-v --asyncio-mode=auto --ignore=tests/test_contract"
testpaths = ["tests", "src", "scripts"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

filterwarnings = [
    "ignore::DeprecationWarning:starlette",
    "ignore::PendingDeprecationWarning:starlette",
    "ignore:.*will be deprecated Pact Python v3:PendingDeprecationWarning",
]

# Custom marks used by contract-test provider verifications, declared so
# `-m provider` (etc.) can filter without `PytestUnknownMarkWarning`.
markers = [
    "provider: provider-side contract verification tests (Pact verifier)",
    "auth: contract pairs whose provider is `auth-api`",
    "users: contract pairs whose provider is `users-api`",
    "posts: contract pairs whose provider is `posts-api`",
    "providers: contract pairs whose provider is `providers-api`",
    "organizations: contract pairs whose provider is `organizations-api`",
    "programs: contract pairs whose provider is `programs-api`",
]

[tool.title-case-check]
ignore_files = [
    "*.log", "*.tmp", ".git/**", "venv/**", "node_modules/**",
    "build/**", "dist/**", "__pycache__/**"
]
always_capitalize = [
    "API", "APIs", "URL", "URLs", "HTTP", "HTTPS", "JSON", "XML", "HTML", "CSS", "JS",
    "SQL", "REST", "RESTful", "FastAPI", "SQLAlchemy", "Jinja2", "pytest", "GitHub",
    "OAuth", "JWT", "UUID", "UUIDs", "CRUD", "TDD", "LLM", "LLMs", "AI", "MVP",
    "PostgreSQL", "SQLite", "Docker", "Python", "JavaScript", "TypeScript",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "src*"]
